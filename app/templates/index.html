<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 p-4 shadow rounded bg-white">
        <h2 class="text-center mb-4">BMI Calculator</h2>
        <form method="POST" class="row g-3">
            <div class="col-md-6">
                <label for="height" class="form-label">Height (in feet)</label>
                <input type="number" step="any" class="form-control" id="height" name="height" required>
            </div>
            <div class="col-md-6">
                <label for="weight" class="form-label">Weight (in kgs)</label>
                <input type="number" step="any" class="form-control" id="weight" name="weight" required>
            </div>
            <div class="col-12 text-center">
                <button type="submit" class="btn btn-primary px-5">Calculate BMI</button>
            </div>
        </form>

        {% if bmi %}
            <div class="mt-4 text-center">
                <h4>Your BMI is: <span style="color: {{ color }};">{{ bmi }}</span></h4>
                <h5>Category: <span style="color: {{ color }};">{{ category }}</span></h5>
            </div>
        {% endif %}
    </div>
</body>
</html>
