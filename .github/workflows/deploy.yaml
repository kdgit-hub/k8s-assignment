name: Build and Deploy BMI App

 

on:

  push:

    branches:

      - main

 

jobs:

  build-deploy:

    runs-on: self-hosted

 

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4

 

      - name: Login to Docker Hub

        uses: docker/login-action@v4

        with:

          username: ${{ secrets.DOCKER_USERNAME }}

          password: ${{ secrets.DOCKER_PASSWORD }}

 

      - name: Build Docker Image

        run: docker build -t venkata465/bmi-image:${{ github.run_number }} -t venkata465/bmi-image:latest .

 

      - name: Push Docker Image

        run: |

          docker push venkata465/bmi-image:${{ github.run_number }}

          docker push venkata465/bmi-image:latest