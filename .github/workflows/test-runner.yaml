name: Test Self Hosted Runner
on:

  push:

    branches:

      - main
jobs:

  test:

    runs-on: self-hosted

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4

 

      - name: Check Docker

        run: docker --version

 

      - name: Check Kubernetes Nodes

        run: kubectl get nodes

 

      - name: Check Minikube

        run: minikube status -p k8s-assignment